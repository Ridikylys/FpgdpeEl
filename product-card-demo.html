<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Демо карточки товара — Донпромэнерго Электроника</title>
	<link rel="shortcut icon" href="img/site_logo.ico">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/pre-style.css">
	<link rel="stylesheet" href="css/product-card.css">
</head>
<body class="product-card-page">
	<div class="product-card-demo">
		<div class="product-card">
			<div class="product-card__visual">
				<span class="product-card__badge">В наличии</span>
				<img src="img/IMG_0260.png" alt="БПВВ-1" class="product-card__image">
				<div class="product-card__glow" aria-hidden="true"></div>
			</div>
			<div class="product-card__content">
				<div class="product-card__eyebrow">Готовая продукция</div>
				<h2 class="product-card__title">БПВВ-1 <span class="product-card__title-note">(ВР-220-02A)</span></h2>
				<p class="product-card__desc">Блок питания и&nbsp;ввода для устройств вторичной коммутации. Надёжное отечественное решение для энергетических объектов.</p>
				<ul class="product-card__features">
					<li class="product-card__feature">
						<span class="product-card__feature-icon" aria-hidden="true"></span>
						<span>Входное напряжение 220&nbsp;В</span>
					</li>
					<li class="product-card__feature">
						<span class="product-card__feature-icon" aria-hidden="true"></span>
						<span>Сертифицировано для РФ</span>
					</li>
					<li class="product-card__feature">
						<span class="product-card__feature-icon" aria-hidden="true"></span>
						<span>Собственное производство</span>
					</li>
				</ul>
				<div class="product-card__footer">
					<span class="product-card__price">по запросу</span>
					<a href="mailto:manager@ppdzva.ru?subject=Запрос%20на%20БПВВ-1" class="product-card__cta">
						Запросить КП
						<span class="product-card__cta-arrow" aria-hidden="true"></span>
					</a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
